<sly data-sly-use.clientlib="core/wcm/components/commons/v1/templates/clientlib.html">
    <sly data-sly-call="${clientlib.css @ categories='aem-hybrid-calix.base'}"/>
    <sly data-sly-call="${clientlib.css @ categories='aem-hybrid-calix.site'}"/>
    <sly data-sly-call="${clientlib.css @ categories='aem-hybrid-calix.react'}"/>
    <sly data-sly-call="${clientlib.js @ categories='aem-hybrid-calix.personalization'}"/>
</sly>

<!--/* ============================================================
     ADOBE TARGET (OOTB) INTEGRATION
     ------------------------------------------------------------
     Officially supported AEM Sites + Adobe Target integration —
     no custom personalization code required.

     Steps to enable (Tools > Cloud Services > Adobe Target in AEM):
       1. Create a Target Cloud Service configuration with your
          Adobe Target "Client Code".
       2. Assign it under Sites > aem-hybrid-calix > Properties >
          Cloud Services.
       3. Click "View Code" on the configuration — AEM generates the
          at.js embed snippet (early-hiding style + async loader)
          already wired to your tenant. Paste it below.
       4. Publish. Activities created in Target's Visual Experience
          Composer against this page will personalize it live.
     ============================================================ */-->
<!-- PASTE-AEM-GENERATED-TARGET-EMBED-CODE-HERE -->

<!--/* ============================================================
     SEO meta tags (title, description, canonical, OG, Twitter, JSON-LD)
     Values are authored via Page Properties; sensible fallbacks apply.
     ============================================================ */-->
<sly data-sly-test.pageTitle="${currentPage.properties.pageTitle || currentPage.title || currentPage.name}"/>
<sly data-sly-test.metaTitle="${currentPage.properties.metaTitle || pageTitle}"/>
<sly data-sly-test.metaDescription="${currentPage.properties.metaDescription || currentPage.description}"/>
<sly data-sly-test.metaKeywords="${currentPage.properties.metaKeywords}"/>
<sly data-sly-test.metaRobots="${currentPage.properties.metaRobots || 'index,follow'}"/>
<sly data-sly-test.ogImage="${currentPage.properties.ogImage}"/>
<sly data-sly-test.siteName="${currentPage.properties.siteName || 'Calix'}"/>
<sly data-sly-test.defaultCanonical="${'{0}.html' @ format=currentPage.path}"/>
<sly data-sly-test.canonicalPath="${currentPage.properties.canonicalUrl || defaultCanonical}"/>
<sly data-sly-test.pageLang="${currentPage.language.toString || 'en-US'}"/>

<meta name="description" content="${metaDescription}" data-sly-test="${metaDescription}"/>
<meta name="keywords" content="${metaKeywords}" data-sly-test="${metaKeywords}"/>
<meta name="robots" content="${metaRobots}"/>
<meta name="author" content="${siteName}"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="canonical" href="${canonicalPath}"/>

<!--/* Open Graph */-->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="${siteName}"/>
<meta property="og:title" content="${metaTitle}"/>
<meta property="og:description" content="${metaDescription}" data-sly-test="${metaDescription}"/>
<meta property="og:url" content="${canonicalPath}"/>
<meta property="og:image" content="${ogImage}" data-sly-test="${ogImage}"/>
<meta property="og:locale" content="${pageLang}"/>

<!--/* Twitter Card */-->
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="${metaTitle}"/>
<meta name="twitter:description" content="${metaDescription}" data-sly-test="${metaDescription}"/>
<meta name="twitter:image" content="${ogImage}" data-sly-test="${ogImage}"/>

<!--/* JSON-LD structured data: Organization + WebSite */-->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@graph": [
        {
            "@type": "Organization",
            "name": "${siteName @ context='scriptString'}",
            "url": "${canonicalPath @ context='scriptString'}"
        },
        {
            "@type": "WebSite",
            "name": "${siteName @ context='scriptString'}",
            "url": "${canonicalPath @ context='scriptString'}",
            "inLanguage": "${pageLang @ context='scriptString'}"
        }
    ]
}
</script>
